<VirtualHost *:80>
	ServerName 127.0.0.1
	Redirect permanent / https://localhost/
</VirtualHost>

<VirtualHost *:443>
	ServerName 127.0.0.1
	DocumentRoot /var/www/localhost/htdocs/sub/public

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/localhost.crt
	SSLCertificateKeyFile /etc/ssl/private/localhost.key

	<Directory /var/www/localhost/htdocs/sub/public>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
