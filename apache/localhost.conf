LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so

AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json application/xml

ServerName 172.17.0.2

<VirtualHost *:80>
	Redirect permanent / https://localhost/
</VirtualHost>

<VirtualHost *:443>
	DocumentRoot /var/www/localhost/htdocs/sub/public

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/localhost.crt
	SSLCertificateKeyFile /etc/ssl/private/localhost.key

	<Directory /var/www/localhost/htdocs/sub/public>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
